name: Multi-environment CI/CD

on:
  push:
    branches: [ "develop", "main" ]

jobs:
  build:
    name: Test and package application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build and test
        run: ./gradlew test bootJar
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://api.staging.example.com
    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact
      - name: Deploy staging release
        run: echo "Staging deployment approved for commit $GITHUB_SHA"

  deploy-prod:
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact
      - name: Deploy production release
        run: echo "Production deployment approved for commit $GITHUB_SHA"

